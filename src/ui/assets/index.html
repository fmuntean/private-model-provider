<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';\" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Model Chat</title>
    <link href="{{styleUri}}" rel="stylesheet" />
</head>
<body>
    <!-- Main grid container -->
    <div id="main-content">
        <!-- Top area: session list will be loaded here -->
        <div id="top-area">
            <h3>Sessions</h3>
            <p>Loading sessions...</p>
        </div>

        <!-- Bottom area: input controls (always visible) -->
        <div id="input-controls">
            <!-- @file context mentions area -->
            <div id="context-mentions"></div>
            
            <div id="input-bar">
                <textarea id="user-input" rows="2" placeholder="Type @ to mention files or ask a question..."></textarea>
                <button id="attach-btn" class="icon-btn" title="Attach file context">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M13.5 3.5l-8 8c-.8.8-2.2.8-3 0s-.8-2.2 0-3l7-7c.4-.4 1-.4 1.4 0s.4 1 0 1.4l-7 7c-.2.2-.5.2-.7 0s-.2-.5 0-.7l6.3-6.3.7.7-6.3 6.3c-.6.6-.6 1.5 0 2.1s1.5.6 2.1 0l7-7c.8-.8.8-2.2 0-3s-2.2-.8-3 0l-7 7c-1.2 1.2-1.2 3.1 0 4.2s3.1 1.2 4.2 0l8-8 .7.7z"/>
                    </svg>
                </button>
                <button id="stop-btn" class="icon-btn" style="display: none;" title="Stop generating">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <rect x="3" y="3" width="10" height="10" rx="1"></rect>
                    </svg>
                </button>
                <button id="send-btn" class="icon-btn" title="Send message">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M1.5 1.5l13 6.5-13 6.5V9.5L7 8 1.5 6.5V1.5z"></path>
                    </svg>
                </button>
            </div>
            <div id="model-selector-inline">
                <label for="model-select">Model:</label>
                <select id="model-select">
                    <option value="">Loading models...</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Hidden file picker -->
    <input type="file" id="file-picker" style="display: none;" multiple />

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
